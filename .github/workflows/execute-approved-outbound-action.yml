name: Execute approved outbound action

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: outbound-action-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.label.name == 'approval:approved'
    runs-on: [self-hosted, Windows, X64, target-shopping]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Execute approved issue
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEALHUNTER_CHROME_PROFILE_NAME: ${{ vars.DEALHUNTER_CHROME_PROFILE_NAME }}
          APPROVED_ISSUE_BODY: ${{ github.event.issue.body }}
          APPROVED_ISSUE_UPDATED_AT: ${{ github.event.issue.updated_at }}
        run: >-
          npm run outbound:execute --
          --issue-number "${{ github.event.issue.number }}"
